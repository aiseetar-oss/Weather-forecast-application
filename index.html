<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1 class="app-title">🌤️ Weather Forecast Application</h1>
<p class="app-subtitle">Your daily weather updates, all in one place.</p>
    <div class="weather-container">

        <h1>Weather Forecast</h1>

        <div class="search-box">
    <input type="text" id="cityInput" placeholder="Enter city name">
    <button id="searchBtn">Search</button>
    <button id="refreshBtn">Refresh</button>
</div>

        <div class="weather-info">
            <p id="description">Weather description will appear here</p>
    
            <p id="loadingMessage"></p>

            <h2 id="cityName">City Name</h2>

            <h1 id="temperature">-- °C</h1>

            <div id="weatherIcon">🌤️</div>

<p id="lastUpdated">last Updated: --</p>

            <div class="details">

                <div>
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div>
                    <h3>Wind Speed</h3>
                    <p id="wind">-- km/h</p>
                </div>

            </div>

        </div>

    </div>
<div class="forecast-section">

    <h2>7-Day Forecast</h2>

    <div class="forecast-container" id="forecastContainer">

        <p>Search a city to see its forecast.</p>

    </div>

</div>
    
    <script src="script.js"></script>

</body>
</html>
